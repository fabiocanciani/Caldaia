name: Build Caldaia APK
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK 35 and build tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile debug APK and save full diagnostics
        shell: bash
        run: |
          set -o pipefail
          gradle --version
          gradle :app:assembleDebug --stacktrace --info --no-daemon 2>&1 | tee android-build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Caldaia-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics even when build fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Caldaia-Build-Log
          path: android-build.log
          if-no-files-found: warn
          retention-days: 7
